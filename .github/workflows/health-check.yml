name: Health Check Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-check-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run health checks
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          WATCHTOWER_WORKER_SECRET: ${{ secrets.WATCHTOWER_WORKER_SECRET }}
          # Add one line per ${VAR_NAME} placeholder used in services.yml,
          # e.g. for a service that needs a bearer token or basic auth:
          # INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          # PROTECTED_SERVICE_USER: ${{ secrets.PROTECTED_SERVICE_USER }}
          # PROTECTED_SERVICE_PASS: ${{ secrets.PROTECTED_SERVICE_PASS }}
        run: python scripts/check_health.py

      - name: Commit updated state
        if: always()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update health check state"
            git push
          fi
