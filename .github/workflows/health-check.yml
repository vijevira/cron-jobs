name: Health Check Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-check-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run health checks
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          WATCHTOWER_WORKER_SECRET: ${{ secrets.WATCHTOWER_WORKER_SECRET }}
          # Add one line per ${VAR_NAME} placeholder used in services.yml,
          # e.g. for a service that needs a bearer token or basic auth:
          # INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          # PROTECTED_SERVICE_USER: ${{ secrets.PROTECTED_SERVICE_USER }}
          # PROTECTED_SERVICE_PASS: ${{ secrets.PROTECTED_SERVICE_PASS }}
        run: python scripts/check_health.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: update health check state"
            git push
            exit 0
          fi

          # GitHub auto-disables a scheduled workflow after 60 days with no
          # repository activity. If nothing has changed (all services have
          # been healthy), push an empty commit well before that window
          # closes so the schedule never silently stops firing.
          last_commit_epoch=$(git log -1 --format=%ct)
          now_epoch=$(date +%s)
          days_since=$(( (now_epoch - last_commit_epoch) / 86400 ))
          if [ "$days_since" -ge 7 ]; then
            git commit --allow-empty -m "chore: heartbeat to keep scheduled workflow active"
            git push
          fi
