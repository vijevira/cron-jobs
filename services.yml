# List every service you want monitored here.
# - name: short label used in logs, state.json, and alert emails
# - url: the health-check endpoint to call
# - method: HTTP method, defaults to GET (set POST for check-endpoints that require it)
# - expected_status: HTTP status code(s) that count as "healthy". Can be a
#     single code (e.g. 200), a list (e.g. [200, 202, 204]), or omitted
#     entirely to accept any 2xx response as success.
# - timeout: seconds to wait before treating the request as failed (default 10)
# - headers: optional dict of request headers
# - body: optional dict, sent as JSON (only meaningful for POST/PUT/etc)
# - auth: optional basic-auth block: { type: basic, username: ..., password: ... }
#
# NEVER put real credentials directly in this file — it's committed to git.
# Instead reference an env var with ${VAR_NAME}, add the real value as a repo
# secret, and map it into the workflow's `env:` block (see README.md).

services:
  # - name: Example Service
  #   url: https://example.com/health
  #   expected_status: 200
  #   timeout: 10

  - name: WatchTower Health Check API
    url: https://api.watchtower.endra.in/health
    timeout: 60

  - name: Watchtower worker
    url: https://api.watchtower.endra.in/api/worker/run
    method: POST
    timeout: 60
    headers:
      x-worker-secret: "${WATCHTOWER_WORKER_SECRET}"
    body:
      ping: true
  
  - name: Arcade server health check
    url: https://api.arcade.endra.in/health
    timeout: 30

  - name: Chhakkadi health check
    url: https://api.chhakkadi.endra.in/health
    timeout: 30

  - name: Zyvora health check
    url: https://api.zyvora.endra.in/health
    timeout: 30

  # POST endpoint with a bearer token from a repo secret:
  # - name: Internal Admin API
  #   url: https://internal.example.com/health
  #   method: POST
  #   expected_status: [200, 201, 204]
  #   headers:
  #     Authorization: "Bearer ${INTERNAL_API_TOKEN}"
  #   body:
  #     ping: true

